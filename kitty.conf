# ==============================================================================
#  1. TYPOGRAPHY & LIGATURES (Iosevka Nerd Font)
# ==============================================================================
font_family      Iosevka Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Enable programming ligatures & subtle line breathing room
disable_ligatures         never
modify_font               cell_height 100%
modify_font               underline_position 2
modify_font               underline_thickness 150%

# ==============================================================================
#  2. WINDOW LAYOUT, TITLEBAR & GLASSMORPHISM
# ==============================================================================
window_padding_width      16
confirm_os_window_close   0
remember_window_size      no
initial_window_width      800
initial_window_height     560

# Seamless Titlebar (Blends native bar into #0A0A0A on macOS & Linux)
macos_titlebar_color      #0A0A0A
wayland_titlebar_color    #0A0A0A

# Glassmorphism / Frosted Obsidian Blur
background_opacity        0.68
background_blur           25
dynamic_background_opacity yes

# ==============================================================================
#  3. PANE BORDERS & FOCUS DIMMING
# ==============================================================================
enabled_layouts           splits:split_axis=horizontal,stack
window_border_width       1.5pt
draw_minimal_borders      yes
active_border_color       #FFFFFF
inactive_border_color     #262626
bell_border_color         #888888

# Dim inactive splits so your active pane pops
inactive_text_alpha       0.65

# ==============================================================================
#  4. CURSOR & FLUID MOTION
# ==============================================================================
cursor_shape              beam
cursor_beam_thickness     1.8
cursor_blink_interval     0.5
cursor_stop_blinking_after 15.0

# Smooth cursor trail (Kitty 0.37+)
cursor_trail              3
cursor_trail_decay        0.1 0.4
cursor_trail_start_threshold 2

# ==============================================================================
#  5. POWERLINE TAB BAR (With Bell & Zoom Indicators)
# ==============================================================================
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_min_tabs          1
tab_activity_symbol       "● "
bell_on_tab               "   "
tab_title_template        "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title} {'[Z]' if layout_name == 'stack' else ''}"

# ==============================================================================
#  6. SCROLLBACK, MOUSE & URLS
# ==============================================================================
scrollback_lines          10000
scrollback_pager_history_size 10
wheel_scroll_multiplier   5.0
mouse_hide_wait           2.0
url_style                 curly
open_url_with             default
copy_on_select            clipboard
strip_trailing_spaces     smart

# ==============================================================================
#  7. PERFORMANCE & AUDIO
# ==============================================================================
repaint_delay             8
input_delay               2
sync_to_monitor           yes
enable_audio_bell         no
visual_bell_duration      0.0

# ==============================================================================
#  8. COLOR SCHEME: OBSIDIAN MONOCHROME
# ==============================================================================
foreground              #EAEAEA
background              #0A0A0A
selection_foreground    #0A0A0A
selection_background    #FFFFFF

# Cursor & URLs
cursor                  #FFFFFF
cursor_text_color       #0A0A0A
url_color               #D4D4D4

# Tab bar colors
active_tab_foreground   #0A0A0A
active_tab_background   #FFFFFF
active_tab_font_style   bold
inactive_tab_foreground #7A7A7A
inactive_tab_background #141414
inactive_tab_font_style normal
tab_bar_background      #0A0A0A

# Shaded 16-color grayscale palette (Preserves syntax hierarchy without color)
color0  #1C1C1C
color8  #4D4D4D
color1  #B0B0B0
color9  #D4D4D4
color2  #D8D8D8
color10 #F2F2F2
color3  #C4C4C4
color11 #E6E6E6
color4  #999999
color12 #BDBDBD
color5  #ADADAD
color13 #CFCFCF
color6  #CFCFCF
color14 #EBEBEB
color7  #E0E0E0
color15 #FFFFFF

# ==============================================================================
#  9. POWER-USER KEYBINDINGS (No tmux required)
# ==============================================================================
# Reload config on the fly
map ctrl+shift+f5         load_config_file

# Quick opacity adjustment
map ctrl+shift+o          set_background_opacity +0.05
map ctrl+shift+p          set_background_opacity -0.05
map ctrl+shift+backspace  set_background_opacity default

# Splits (Horizontal & Vertical)
map ctrl+shift+enter      launch --location=hsplit --cwd=current
map ctrl+shift+\          launch --location=vsplit --cwd=current

# Navigate between splits with Ctrl + Shift + Arrow Keys
map ctrl+shift+left       neighboring_window left
map ctrl+shift+right      neighboring_window right
map ctrl+shift+up         neighboring_window up
map ctrl+shift+down       neighboring_window down

# Zoom/Unzoom current split (like tmux Ctrl-b z)
map ctrl+shift+z          toggle_layout stack

# Quick-select URLs or file paths via keyboard hints
map ctrl+shift+e          open_url_with_hints
map ctrl+shift+f          kitten hints --type path --program -

# Font size zooming
map ctrl+equal            change_font_size all +1.0
map ctrl+minus            change_font_size all -1.0
map ctrl+0                change_font_size all 0

# ==============================================================================
#  SHELL (Launch Fish directly in Kitty)
# ==============================================================================
shell fish
shell_integration enabled
